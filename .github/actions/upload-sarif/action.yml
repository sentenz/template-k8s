# SPDX-License-Identifier: Apache-2.0

name: Upload SARIF
description: Preserve SARIF reports and upload to GitHub Security when code scanning is enabled.

inputs:
  sarif-file:
    description: Path to the SARIF report.
    required: true
  artifact-name:
    description: Unique name for the SARIF artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Preserve SARIF report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.sarif-file }}
        if-no-files-found: error

    - name: Check code scanning availability
      id: code-scanning
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        error_file="$(mktemp)"
        trap 'rm -f "$error_file"' EXIT
        if gh api "repos/${GH_REPO}/code-scanning/analyses?per_page=1" > /dev/null 2> "$error_file"; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        elif grep -Fq "Code scanning is not enabled for this repository" "$error_file" ||
             grep -Fq "Advanced Security must be enabled for this repository to use code scanning" "$error_file"; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Code scanning is disabled for this repository. The SARIF report is available in the workflow artifacts."
        else
          cat "$error_file" >&2
          exit 1
        fi

    - name: Upload results to GitHub Security
      if: steps.code-scanning.outputs.enabled == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
