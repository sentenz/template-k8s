# SPDX-License-Identifier: Apache-2.0
name: Sigstore
description: Keyless signing and fail-closed verification against repository policy
inputs:
  operation:
    description: sign or verify (sign also verifies before returning)
    required: true
  kind:
    description: image, release (archives and SBOMs), or firmware
    required: true
  identity:
    description: Exact certificate identity, which must be allowed by the policy
    required: true
  image:
    description: Immutable registry reference including sha256 digest
    default: ""
  files:
    description: Newline-delimited exact files; no globs. Each gets a .sigstore.json bundle
    default: ""
  bundle:
    description: Output image bundle (blob bundles are adjacent to each file)
    default: image.sigstore.json
  release-version:
    description: Signed release-version annotation required for image promotion
    default: ""
  policy:
    description: Reviewed policy path, independent of downloaded artifacts
    default: .github/sigstore/policy.json
runs:
  using: composite
  steps:
    - name: Install pinned Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      with:
        cosign-release: v3.1.4
    - name: Enforce Sigstore policy
      shell: bash
      env:
        SIGSTORE_OPERATION: ${{ inputs.operation }}
        SIGSTORE_KIND: ${{ inputs.kind }}
        SIGSTORE_IDENTITY: ${{ inputs.identity }}
        SIGSTORE_IMAGE: ${{ inputs.image }}
        SIGSTORE_FILES: ${{ inputs.files }}
        SIGSTORE_BUNDLE: ${{ inputs.bundle }}
        SIGSTORE_RELEASE_VERSION: ${{ inputs.release-version }}
        SIGSTORE_POLICY: ${{ inputs.policy }}
      run: python3 "${GITHUB_ACTION_PATH}/sigstore.py"
