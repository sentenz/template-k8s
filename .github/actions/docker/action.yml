# SPDX-License-Identifier: Apache-2.0
name: Docker candidate
description: Temporary sentenz/actions/docker adaptation; stage by digest without release tags
inputs:
  push:
    description: Push an untagged candidate for signing
    default: "false"
  github-token:
    description: GHCR token; required only when pushing
    default: ${{ github.token }}
  context:
    description: Build context
    default: .
  file:
    description: Dockerfile
    default: container/k8s/Dockerfile
outputs:
  image:
    description: Fully qualified image repository
    value: ${{ steps.metadata.outputs.image }}
  digest:
    description: Immutable multi-platform manifest digest
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Resolve candidate repository
      id: metadata
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        PUSH: ${{ inputs.push }}
      run: |
        set -euo pipefail
        [[ "$PUSH" == true || "$PUSH" == false ]]
        echo "image=ghcr.io/${OWNER,,}/k8s" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      if: inputs.push == 'true'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Build candidate without release tags
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: linux/amd64,linux/arm64
        outputs: type=image,name=${{ steps.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha,scope=k8s
        cache-to: type=gha,mode=max,scope=k8s
