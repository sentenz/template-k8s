# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-git-tag: ${{ steps.release.outputs.new-release-git-tag }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          semantic-version: "25.0.3"
          extra-plugins: |
            @semantic-release/changelog@^6
            @semantic-release/git@^10
            conventional-changelog-conventionalcommits@9.3.1

  # Tags created with GITHUB_TOKEN do not trigger push workflows. Explicit
  # workflow_dispatch events are permitted and retain the released tag as ref.
  dispatch-release:
    name: Dispatch release publication
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Docker and SBOM workflows on the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.semantic-release.outputs.new-release-git-tag }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable SemVer release tag, got: ${RELEASE_TAG}"
            exit 1
          fi

          gh workflow run docker.yml --ref "${RELEASE_TAG}"
          gh workflow run sbom.yml --ref "${RELEASE_TAG}"
