# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main
      - next
      - beta
      - alpha

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@bceed480720a7bc304e974cd655ebe42ac41d5e2 # 1.1.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          semantic-version: "25.0.3"
          extra-plugins: |
            @semantic-release/changelog@^6
            @semantic-release/git@^10
            conventional-changelog-conventionalcommits@9.3.1

      - name: Run SBOM Generation (CycloneDX)
        if: steps.release.outputs.new-release-published == 'true'
        uses: sentenz/actions/trivy@bceed480720a7bc304e974cd655ebe42ac41d5e2 # 1.1.9
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Run SBOM Generation (SPDX)
        if: steps.release.outputs.new-release-published == 'true'
        uses: sentenz/actions/trivy@bceed480720a7bc304e974cd655ebe42ac41d5e2 # 1.1.9
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Publish SBOM artifacts
        if: steps.release.outputs.new-release-published == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.new-release-version }}
          files: |
            sbom.cdx.json
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-container:
    name: Publish Container Image
    needs:
      - semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.semantic-release.outputs.new-release-version }}
          persist-credentials: false

      - name: Publish Container Image
        uses: sentenz/actions/container-image@edd5e1e574e3eaa1254fbd19f4d2f0a5854c574d # 1.2.1
        with:
          version: ${{ needs.semantic-release.outputs.new-release-version }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
