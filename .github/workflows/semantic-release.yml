# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # PAT-authored tags trigger the downstream push.tags workflows.
      - name: Validate release PAT
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [[ -z "${RELEASE_PAT}" ]]; then
            echo "::error::Configure the RELEASE_PAT repository secret for Semantic Release"
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          semantic-version: "25.0.3"
          extra-plugins: |
            @semantic-release/changelog@^6
            @semantic-release/git@^10
            conventional-changelog-conventionalcommits@9.3.1
