name: Kind

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "config/**"
      - "manifests/**"
      - "GNUmakefile"
      - "Makefile"
      - "make/**"
      - "scripts/bootstrap.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "config/**"
      - "manifests/**"
      - "GNUmakefile"
      - "Makefile"
      - "make/**"
      - "scripts/bootstrap.sh"
  workflow_dispatch:

concurrency:
  group: kind-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-deployment:
    name: Kind Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Make Kubernetes Rendering
        shell: bash
        run: |
          set -euo pipefail

          make -pn | grep -q '^k8s-backup:'
          make -pn | grep -q '^k8s-image-hotfix:'

          for environment in dev stage prod; do
            make -s k8s-render K8S_ENV="${environment}"
          done

      - name: Test Kind Deployment
        uses: ./.github/actions/kind
        with:
          cluster-name: template-k8s
          kind-config: config/kind-cluster.yaml
          kustomize-path: manifests/overlays/dev/dependency-track
