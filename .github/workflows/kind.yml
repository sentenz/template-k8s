name: Kind

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "config/**"
      - "manifests/**"
      - "GNUmakefile"
      - "Makefile"
      - "make/**"
      - "scripts/bootstrap.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "charts/**"
      - "config/**"
      - "manifests/**"
      - "GNUmakefile"
      - "Makefile"
      - "make/**"
      - "scripts/bootstrap.sh"
  workflow_dispatch:

concurrency:
  group: kind-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-deployment:
    name: Kind Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Dev Make Rendering
        shell: bash
        run: |
          set -euo pipefail
          if ! output="$(make -s k8s-backup K8S_ENV=dev K8S_BACKUP_DIR="${RUNNER_TEMP}/kubernetes-backups/dev" 2>&1)"; then
            printf '%s\n' "${output}" >&2
            message="${output//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Dev Make rendering failed::${message}"
            exit 1
          fi

      - name: Validate Stage Make Rendering
        shell: bash
        run: |
          set -euo pipefail
          make -s k8s-backup \
            K8S_ENV=stage \
            K8S_BACKUP_DIR="${RUNNER_TEMP}/kubernetes-backups/stage"

      - name: Validate Prod Make Rendering
        shell: bash
        run: |
          set -euo pipefail
          make -s k8s-backup \
            K8S_ENV=prod \
            K8S_BACKUP_DIR="${RUNNER_TEMP}/kubernetes-backups/prod"

      - name: Test Kind Deployment
        uses: ./.github/actions/kind
        with:
          cluster-name: template-k8s
          kind-config: config/kind-cluster.yaml
          kustomize-path: manifests/overlays/dev/dependency-track
