# SPDX-License-Identifier: Apache-2.0

name: Kind

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "apps/**"
      - "vendor/helm/**"
      - "clusters/**"
      - "components/**"
      - "platform/**"
      - "GNUmakefile"
      - "Makefile"
      - "scripts/bootstrap.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/kind/**"
      - ".github/workflows/kind.yml"
      - "apps/**"
      - "vendor/helm/**"
      - "clusters/**"
      - "components/**"
      - "platform/**"
      - "GNUmakefile"
      - "Makefile"
      - "scripts/bootstrap.sh"
  workflow_dispatch:

concurrency:
  group: kind-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kind-deployment:
    name: Kind Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Ephemeral TLS Certificates
        shell: bash
        env:
          INGRESS_HOSTS: dependency-track.localhost grafana.localhost
          KUSTOMIZE_PATH: clusters/dev
          CERTIFICATE_BACKUP: ${{ runner.temp }}/kind-certificate-backup
        run: |
          set -euo pipefail

          mkdir -p "${CERTIFICATE_BACKUP}"

          for ingress_host in ${INGRESS_HOSTS}; do
            certificate_path="${KUSTOMIZE_PATH}/${ingress_host}+1.pem"
            private_key_path="${KUSTOMIZE_PATH}/${ingress_host}+1-key.pem"

            for path in "${certificate_path}" "${private_key_path}"; do
              name="$(basename "${path}")"
              if [[ -e "${path}" ]]; then
                cp -p -- "${path}" "${CERTIFICATE_BACKUP}/${name}"
                touch "${CERTIFICATE_BACKUP}/${name}.present"
              fi
            done

            make k8s-certificate-generate \
              K8S_HOSTNAME="${ingress_host}" \
              K8S_CERTIFICATE_DIR="${KUSTOMIZE_PATH}" \
              K8S_CERTIFICATE_DAYS=1
          done

      - name: Create Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          kubectl_version: v1.36.1
          config: clusters/dev/kind-cluster.yaml
          kubeconfig: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
          cluster_name: template-k8s
          wait: 5m

      - name: Verify Cluster Prerequisites
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
        run: |
          set -euo pipefail

          kind version
          kubectl version --output=yaml
          kubectl wait --for=condition=Ready node --all --timeout=5m

          node_count="$(kubectl get nodes --no-headers | wc -l | tr -d ' ')"
          control_plane_count="$(kubectl get nodes --selector='node-role.kubernetes.io/control-plane' --no-headers | wc -l | tr -d ' ')"
          worker_count="$(kubectl get nodes --selector='!node-role.kubernetes.io/control-plane' --no-headers | wc -l | tr -d ' ')"

          if [[ "${node_count}" != "3" || "${control_plane_count}" != "1" || "${worker_count}" != "2" ]]; then
            echo "Unexpected Kind topology: nodes=${node_count}, control-planes=${control_plane_count}, workers=${worker_count}" >&2
            kubectl get nodes --show-labels >&2
            exit 1
          fi

          default_storage_class="$(kubectl get storageclass -o go-template='{{range .items}}{{if eq (index .metadata.annotations "storageclass.kubernetes.io/is-default-class") "true"}}{{.metadata.name}}{{end}}{{end}}')"
          storage_provisioner="$(kubectl get storageclass "${default_storage_class}" -o jsonpath='{.provisioner}')"
          if [[ "${storage_provisioner}" != "rancher.io/local-path" ]]; then
            echo "Unexpected default StorageClass provisioner: ${storage_provisioner}" >&2
            exit 1
          fi

      - name: Deploy with Make
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
        run: |
          set -euo pipefail
          printf 'yes-dev\n' | make k8s-deploy \
            K8S_ENV=dev \
            K8S_CLUSTER_PATH=clusters/dev \
            K8S_KUBECONFIG="${KUBECONFIG}"

      - name: Wait for Workloads
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
        run: |
          set -euo pipefail

          wait_for_rollouts() {
            local namespace="$1"
            local timeout="$2"
            local workloads=()

            mapfile -t workloads < <(
              kubectl get deployment,statefulset,daemonset \
                --namespace "${namespace}" \
                --output name
            )

            if (( ${#workloads[@]} == 0 )); then
              echo "No rollout-managed workloads found in namespace ${namespace}" >&2
              return 1
            fi

            for workload in "${workloads[@]}"; do
              kubectl rollout status \
                --namespace "${namespace}" \
                "${workload}" \
                --timeout "${timeout}"
            done
          }

          wait_for_jobs() {
            local namespace="$1"
            local timeout="$2"
            local jobs=()

            mapfile -t jobs < <(
              kubectl get jobs \
                --namespace "${namespace}" \
                --output name
            )

            for job in "${jobs[@]}"; do
              kubectl wait \
                --namespace "${namespace}" \
                --for=condition=Complete \
                "${job}" \
                --timeout "${timeout}"
            done
          }

          wait_for_active_pods() {
            local namespace="$1"
            local timeout="$2"
            local pods=()

            mapfile -t pods < <(
              kubectl get pods \
                --namespace "${namespace}" \
                --field-selector='status.phase!=Succeeded,status.phase!=Failed' \
                --output name
            )

            for pod in "${pods[@]}"; do
              kubectl wait \
                --namespace "${namespace}" \
                --for=condition=Ready \
                "${pod}" \
                --timeout "${timeout}"
            done
          }

          wait_for_rollouts postgresql 15m
          wait_for_rollouts traefik 10m
          wait_for_rollouts dependency-track 20m
          wait_for_rollouts observability 20m

          wait_for_jobs postgresql 10m
          wait_for_jobs traefik 10m
          wait_for_jobs dependency-track 10m
          wait_for_jobs observability 10m

          for namespace in postgresql traefik dependency-track observability; do
            wait_for_active_pods "${namespace}" 5m
          done

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Bound \
            persistentvolumeclaim \
            --all \
            --namespace postgresql \
            --timeout=5m

      - name: Test Ingress Endpoints
        shell: bash
        env:
          KUSTOMIZE_PATH: clusters/dev
          INGRESS_HOST: dependency-track.localhost
          GRAFANA_HOST: grafana.localhost
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
        run: |
          set -euo pipefail

          curl_options=(
            --cacert "${KUSTOMIZE_PATH}/${INGRESS_HOST}+1.pem"
            --connect-timeout 5
            --fail-with-body
            --location
            --max-time 30
            --noproxy "*"
            --retry 30
            --retry-all-errors
            --retry-delay 10
            --retry-max-time 300
            --show-error
            --silent
            --resolve "${INGRESS_HOST}:443:127.0.0.1"
          )

          curl "${curl_options[@]}" "https://${INGRESS_HOST}/health"
          curl "${curl_options[@]}" --output /dev/null "https://${INGRESS_HOST}/"

          grafana_curl_options=(
            --cacert "${KUSTOMIZE_PATH}/${GRAFANA_HOST}+1.pem"
            --connect-timeout 5
            --fail-with-body
            --location
            --max-time 30
            --noproxy "*"
            --retry 30
            --retry-all-errors
            --retry-delay 10
            --retry-max-time 300
            --show-error
            --silent
            --resolve "${GRAFANA_HOST}:443:127.0.0.1"
          )

          curl "${grafana_curl_options[@]}" --output /dev/null "https://${GRAFANA_HOST}/login"

          grafana_user="$(kubectl get secret grafana-admin --namespace observability --output jsonpath='{.data.admin-user}' | base64 --decode)"
          grafana_password="$(kubectl get secret grafana-admin --namespace observability --output jsonpath='{.data.admin-password}' | base64 --decode)"
          grafana_api_options=(
            "${grafana_curl_options[@]}"
            --user "${grafana_user}:${grafana_password}"
            --header "Accept: application/json"
          )

          curl "${grafana_api_options[@]}" "https://${GRAFANA_HOST}/api/health" \
            | jq -e '.database == "ok"' >/dev/null

          curl "${grafana_api_options[@]}" "https://${GRAFANA_HOST}/api/datasources/uid/prometheus" \
            | jq -e '.uid == "prometheus" and .type == "prometheus"' >/dev/null

          curl "${grafana_api_options[@]}" "https://${GRAFANA_HOST}/api/datasources/uid/prometheus/health" \
            | jq -e '.status == "OK"' >/dev/null

          prometheus_response="$(
            curl "${grafana_api_options[@]}" \
              --get \
              --data-urlencode 'query=up' \
              "https://${GRAFANA_HOST}/api/datasources/proxy/uid/prometheus/api/v1/query"
          )"
          jq -e '.status == "success" and (.data.result | length > 0)' <<<"${prometheus_response}" >/dev/null

          dashboard_query='{"queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"editorMode":"code","expr":"up","instant":true,"range":false,"format":"time_series","intervalMs":1000,"maxDataPoints":100}],"from":"now-5m","to":"now"}'
          dashboard_response="$(
            curl "${grafana_api_options[@]}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data "${dashboard_query}" \
              "https://${GRAFANA_HOST}/api/ds/query"
          )"
          jq -e '.results.A.error == null and (.results.A.frames | length > 0)' <<<"${dashboard_response}" >/dev/null

      - name: Publish Deployment Summary
        if: success()
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
        run: |
          set -euo pipefail
          {
            echo "## Kind deployment test"
            echo
            echo "Deployment command: \`make k8s-deploy\`"
            echo
            echo '```text'
            kubectl get deployments,statefulsets,daemonsets,jobs,pods,services,ingress \
              --all-namespaces \
              -o wide
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect Failure Diagnostics
        if: failure()
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
          DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/kind-diagnostics
        run: |
          set +e
          mkdir -p "${DIAGNOSTICS_DIRECTORY}/logs"

          kubectl get pods --all-namespaces -o wide | tee "${DIAGNOSTICS_DIRECTORY}/pods-wide.txt"
          kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp | tail -n 200 | tee "${DIAGNOSTICS_DIRECTORY}/events.txt"
          kubectl describe pods --all-namespaces > "${DIAGNOSTICS_DIRECTORY}/pods.txt" 2>&1
          kubectl get endpoints monitoring-prometheus --namespace observability --output yaml > "${DIAGNOSTICS_DIRECTORY}/prometheus-endpoints.yaml" 2>&1
          kubectl get configmap monitoring-grafana-datasource --namespace observability --output yaml > "${DIAGNOSTICS_DIRECTORY}/grafana-datasource.yaml" 2>&1
          kubectl get servicemonitors --all-namespaces --output wide > "${DIAGNOSTICS_DIRECTORY}/servicemonitors.txt" 2>&1
          kubectl get prometheusrules --all-namespaces --output wide > "${DIAGNOSTICS_DIRECTORY}/prometheusrules.txt" 2>&1

          while read -r namespace pod; do
            kubectl logs \
              --namespace "${namespace}" \
              "${pod}" \
              --all-containers=true \
              --prefix=true \
              --tail=200 \
              > "${DIAGNOSTICS_DIRECTORY}/logs/${namespace}-${pod}.log" 2>&1 || true
          done < <(
            kubectl get pods --all-namespaces \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}'
          )

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-deployment-diagnostics-template-k8s
          path: ${{ runner.temp }}/kind-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Restore Repository and Remove Ephemeral Credentials
        if: always()
        shell: bash
        env:
          KUSTOMIZE_PATH: clusters/dev
          INGRESS_HOSTS: dependency-track.localhost grafana.localhost
          KUBECONFIG: ${{ runner.temp }}/template-k8s-kubeconfig.yaml
          CERTIFICATE_BACKUP: ${{ runner.temp }}/kind-certificate-backup
          DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/kind-diagnostics
        run: |
          set +e

          for ingress_host in ${INGRESS_HOSTS}; do
            for name in "${ingress_host}+1.pem" "${ingress_host}+1-key.pem"; do
              path="${KUSTOMIZE_PATH}/${name}"
              if [[ -f "${CERTIFICATE_BACKUP}/${name}.present" ]]; then
                mv -f -- "${CERTIFICATE_BACKUP}/${name}" "${path}"
              else
                rm -f -- "${path}"
              fi
            done
          done

          rm -f -- "${KUBECONFIG}"
          rm -rf -- "${CERTIFICATE_BACKUP}" "${DIAGNOSTICS_DIRECTORY}"
