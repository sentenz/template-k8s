# SPDX-License-Identifier: Apache-2.0
name: Firmware signing
# Called after a project's firmware build uploads firmware.bin as firmware-unsigned.
# No hardware/toolchain exists in this Kubernetes template; never sign a placeholder.
on:
  workflow_call:
    outputs:
      signed-artifact-id:
        description: Verified same-run firmware artifact ID
        value: ${{ jobs.sign.outputs.artifact-id }}
permissions: {}
jobs:
  sign:
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: firmware-unsigned
          path: firmware
      - uses: ./.github/actions/sigstore
        with:
          operation: sign
          kind: firmware
          identity: https://github.com/sentenz/template-k8s/.github/workflows/firmware.yml@refs/heads/main
          files: firmware/firmware.bin
      - id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firmware/firmware.bin
            firmware/firmware.bin.sigstore.json
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          merge-multiple: true
          path: firmware
      - uses: ./.github/actions/sigstore
        with:
          operation: verify
          kind: firmware
          identity: https://github.com/sentenz/template-k8s/.github/workflows/firmware.yml@refs/heads/main
          files: firmware/firmware.bin
