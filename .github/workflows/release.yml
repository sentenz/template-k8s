# SPDX-License-Identifier: Apache-2.0
name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Recovery uses the selected tag as the workflow ref, never a version on main.
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.ref_type == 'tag' && github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release source
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/ci/validate-release.sh
  validate:
    needs: source
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/release-validation.yml
  docker:
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
      version: ${{ github.ref_name }}
  sbom:
    needs: docker
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ github.ref_name }}
  promote:
    needs: [docker, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize all latest writes; re-evaluate newest tag inside this lock.
    concurrency:
      group: release-promote-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check latest eligibility
        id: latest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/ci/validate-release.sh
          git fetch --tags --force origin
          python3 scripts/ci/latest-release.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.latest.outputs.promote == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote verified digest
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
