# SPDX-License-Identifier: Apache-2.0

name: SBOM

on:
  workflow_call:
    inputs:
      version:
        description: Git release tag (for example, 1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git release tag (for example, 1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: sbom-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate, Scan, Sign and Publish Release Assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Generate SBOM (CycloneDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Generate SBOM (SPDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Scan SBOM (SPDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom
          scan-target: sbom.spdx.json
        continue-on-error: false

      - name: Scan SBOM (CycloneDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom
          scan-target: sbom.cdx.json
        continue-on-error: false

      - name: Create release archives
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=template-k8s/ HEAD | gzip -n > source.tar.gz
          git archive --format=zip --prefix=template-k8s/ HEAD > source.zip

      - name: Checkout signing action from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .signing-tools
          sparse-checkout: .github/actions/sigstore
          persist-credentials: false

      - name: Sign and verify release assets
        uses: ./.signing-tools/.github/actions/sigstore
        with:
          identity: https://github.com/${{ github.repository }}/.github/workflows/sbom.yml@refs/heads/main
          files: |
            source.tar.gz
            source.zip
            sbom.cdx.json
            sbom.spdx.json

      - name: Publish verified release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.version }}
          fail_on_unmatched_files: true
          files: |
            source.tar.gz
            source.tar.gz.sigstore.json
            source.zip
            source.zip.sigstore.json
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
