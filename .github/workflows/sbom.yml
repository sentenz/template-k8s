# SPDX-License-Identifier: Apache-2.0

name: SBOM

on:
  workflow_call:
    inputs:
      version:
        description: Git release tag (for example, 1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: sbom-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sbom:
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          path: source
          persist-credentials: false

      - name: Generate SBOM (CycloneDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom-generate
          scan-target: source
          format: cyclonedx
          output: sbom.cdx.json

      - name: Generate SBOM (SPDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom-generate
          scan-target: source
          format: spdx-json
          output: sbom.spdx.json

      - name: Scan SBOM (SPDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom
          scan-target: sbom.spdx.json
        continue-on-error: false

      - name: Scan SBOM (CycloneDX)
        uses: sentenz/actions/trivy@4e9e78d246486ad62d8df160a4d07020ece9668a # 1.5.6
        with:
          scan-type: sbom
          scan-target: sbom.cdx.json
        continue-on-error: false

      - name: Build reproducible release archives and manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git -C source archive --format=tar --prefix=template-k8s/ HEAD | gzip -n > source.tar.gz
          git -C source archive --format=zip --prefix=template-k8s/ HEAD > source.zip
          python3 .github/actions/sigstore/release.py create "$VERSION" "$(git -C source rev-parse HEAD)"
      - id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source.tar.gz
            source.zip
            sbom.cdx.json
            sbom.spdx.json
            release-manifest.json
          if-no-files-found: error
          retention-days: 7

  sign:
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    needs: sbom
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - uses: ./.github/actions/sigstore
        with:
          operation: sign
          kind: release
          identity: https://github.com/sentenz/template-k8s/.github/workflows/sbom.yml@refs/heads/main
          files: |
            artifacts/source.tar.gz
            artifacts/source.zip
            artifacts/sbom.cdx.json
            artifacts/sbom.spdx.json
            artifacts/release-manifest.json
      - id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

  stage:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - name: Verify before attaching release assets
        uses: ./.github/actions/sigstore
        with:
          operation: verify
          kind: release
          identity: https://github.com/sentenz/template-k8s/.github/workflows/sbom.yml@refs/heads/main
          files: |
            artifacts/source.tar.gz
            artifacts/source.zip
            artifacts/sbom.cdx.json
            artifacts/sbom.spdx.json
            artifacts/release-manifest.json
      - name: Attach verified artifacts to the draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$VERSION" artifacts/*
