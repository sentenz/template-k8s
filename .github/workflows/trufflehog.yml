# SPDX-License-Identifier: Apache-2.0

name: TruffleHog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: sentenz/actions/trufflehog@8e2d77bd7bd0c72d8a87d770b7eb8135e29d3c17 # 1.8.2
        with:
          path: ./
