name: Docker

on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/workflows/docker-sigstore.yml
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Select an existing tag when dispatching a recovery run.
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Docker Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Build
        uses: sentenz/actions/docker@8e2d77bd7bd0c72d8a87d770b7eb8135e29d3c17 # 1.8.2
        with:
          version: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Docker Action - Publish
    if: github.ref_type == 'tag' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Publish Attested Image
        id: docker-build
        uses: sentenz/actions/docker@8e2d77bd7bd0c72d8a87d770b7eb8135e29d3c17 # 1.8.2
        with:
          version: ${{ github.ref_name }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: true
          publish-latest: false
          provenance: mode=max
          sbom: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and Verify
        uses: sentenz/actions/sigstore@8e2d77bd7bd0c72d8a87d770b7eb8135e29d3c17 # 1.8.2
        with:
          image: ${{ steps.docker-build.outputs.image }}@${{ steps.docker-build.outputs.digest }}
          identity: ${{ github.server_url }}/${{ github.workflow_ref }}

      - name: Retain Verification Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-signature-${{ github.ref_name }}-${{ github.run_attempt }}
          path: image.sigstore.json
          if-no-files-found: error
          retention-days: 90
