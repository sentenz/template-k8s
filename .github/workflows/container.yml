name: Container

on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/workflows/container.yml
  release:
    types:
      - published

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes Toolchain Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate container image
        uses: sentenz/actions/container-image@3e3a5a186498edf6b52f5f80b30a1b637c8be23a # PR sentenz/actions#57
        with:
          operation: build
          version: sha-${{ github.sha }}
          image-name: k8s
          file: container/k8s/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            KUBECTL_VERSION=v1.36.1
            KUSTOMIZE_VERSION=v5.8.1
            KIND_VERSION=v0.32.0
            HELM_VERSION=v4.2.2

  publish:
    name: Publish Kubernetes Toolchain Image
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Publish container image
        uses: sentenz/actions/container-image@3e3a5a186498edf6b52f5f80b30a1b637c8be23a # PR sentenz/actions#57
        with:
          operation: publish
          version: ${{ github.event.release.tag_name }}
          publish-latest: auto
          immutable: true
          image-name: k8s
          file: container/k8s/Dockerfile
          platforms: linux/amd64,linux/arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            KUBECTL_VERSION=v1.36.1
            KUSTOMIZE_VERSION=v5.8.1
            KIND_VERSION=v0.32.0
            HELM_VERSION=v4.2.2
