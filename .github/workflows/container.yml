name: Container

on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/workflows/container.yml
  workflow_call:
    inputs:
      publish:
        description: Publish the container image to GHCR
        required: true
        type: boolean
      version:
        description: Container image version and Git tag to publish
        required: true
        type: string

concurrency:
  group: container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Container Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build Container Image
        uses: sentenz/actions/container-image@edd5e1e574e3eaa1254fbd19f4d2f0a5854c574d # 1.2.1
        with:
          version: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Publish Container Image
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Publish Container Image
        uses: sentenz/actions/container-image@edd5e1e574e3eaa1254fbd19f4d2f0a5854c574d # 1.2.1
        with:
          version: ${{ inputs.version }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
