# SPDX-License-Identifier: Apache-2.0
name: Release Workflow Checks
on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/ci/**
      - tests/ci/**
      - .releaserc.json
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash -n scripts/ci/validate-release.sh
      - run: python3 -m unittest discover -s tests/ci -v
