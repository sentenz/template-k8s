# SPDX-License-Identifier: Apache-2.0

name: SBOM

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Select an existing tag when dispatching a recovery run.
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate, Scan, Sign and Publish Release Assets
    if: github.ref_type == 'tag' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate SBOM (CycloneDX)
        uses: sentenz/actions/trivy@ac68a6837f8890c4570767c0d1f21bcfc133ab1a # 1.5.8
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Generate SBOM (SPDX)
        uses: sentenz/actions/trivy@ac68a6837f8890c4570767c0d1f21bcfc133ab1a # 1.5.8
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Scan SBOM (SPDX)
        uses: sentenz/actions/trivy@ac68a6837f8890c4570767c0d1f21bcfc133ab1a # 1.5.8
        with:
          exit-code: "1"
          scan-type: sbom
          scan-target: sbom.spdx.json
        continue-on-error: false

      - name: Scan SBOM (CycloneDX)
        uses: sentenz/actions/trivy@ac68a6837f8890c4570767c0d1f21bcfc133ab1a # 1.5.8
        with:
          exit-code: "1"
          scan-type: sbom
          scan-target: sbom.cdx.json
        continue-on-error: false

      - name: Sign and verify release assets
        uses: sentenz/actions/sigstore@2f64add54257e1cb22b66ff4755a2ca9fd4454fc # 1.6.0
        with:
          identity: https://github.com/${{ github.repository }}/.github/workflows/trivy-sbom.yml@${{ github.ref }}
          files: |
            sbom.cdx.json
            sbom.spdx.json

      - name: Publish verified release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
