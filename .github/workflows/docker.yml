# SPDX-License-Identifier: Apache-2.0
name: Docker
on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/actions/docker/**
      - .github/actions/sigstore/**
      - .github/sigstore/**
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      publish:
        description: Sign and promote the container image
        required: true
        type: boolean
      version:
        description: Existing draft release and Git tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker
        with:
          push: 'false'

  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/docker
        id: build
        with:
          context: source
          file: source/container/k8s/Dockerfile
          push: 'true'

  sign:
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/sigstore
        with:
          operation: sign
          kind: image
          identity: https://github.com/sentenz/template-k8s/.github/workflows/docker.yml@refs/heads/main
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          release-version: ${{ inputs.version }}
      - id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-signature-${{ github.run_id }}-${{ github.run_attempt }}
          path: image.sigstore.json
          if-no-files-found: error
          retention-days: 90

  stage:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify before accepting the candidate
        uses: ./.github/actions/sigstore
        with:
          operation: verify
          kind: image
          identity: https://github.com/sentenz/template-k8s/.github/workflows/docker.yml@refs/heads/main
          image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          release-version: ${{ inputs.version }}
      - name: Retain image evidence on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" == true ]]
          printf '%s\n' "$IMAGE" > image-reference.txt
          gh release upload "$VERSION" image-reference.txt image.sigstore.json
          # Tags are created only by the final release gate after all artifact checks.
