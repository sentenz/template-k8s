# SPDX-License-Identifier: Apache-2.0

name: Docker

on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/workflows/docker.yml
  workflow_call:
    inputs:
      publish:
        description: Publish the container image to GHCR
        required: true
        type: boolean
      version:
        description: Container image version and Git tag to publish
        required: true
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k8s
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release
        if: github.event_name == 'workflow_call'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/k8s/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/k8s:${{ github.sha }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=k8s-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=k8s-${{ matrix.arch }}

      - name: Smoke test toolchain
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TEST_IMAGE: local/k8s:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail

          docker run --rm --platform "${PLATFORM}" "${TEST_IMAGE}" kubectl version --client
          docker run --rm --platform "${PLATFORM}" "${TEST_IMAGE}" kustomize version
          docker run --rm --platform "${PLATFORM}" "${TEST_IMAGE}" kind version
          docker run --rm --platform "${PLATFORM}" "${TEST_IMAGE}" helm version --short

      - name: Scan critical vulnerabilities
        shell: bash
        env:
          TEST_IMAGE: local/k8s:${{ github.sha }}-${{ matrix.arch }}
        run: |
          set -euo pipefail

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY_IMAGE}" \
            image \
            --exit-code 1 \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "${TEST_IMAGE}"

  publish:
    name: Publish multi-platform image
    needs:
      - validate
    if: github.event_name == 'workflow_call' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: docker-publish-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Resolve image metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${VERSION}"
          image="${IMAGE_NAME,,}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version must be a semantic version without a leading v"
            exit 1
          fi

          stable=false
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          fi

          revision="$(git rev-parse HEAD)"

          {
            echo "image=${image}"
            echo "stable=${stable}"
            echo "revision=${revision}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            if [[ "${stable}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Protect immutable version tag
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version_image="${IMAGE}:${VERSION}"
          if docker buildx imagetools inspect "${version_image}" >/dev/null 2>&1; then
            echo "::error::refusing to overwrite existing image tag: ${version_image}"
            exit 1
          fi

      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: container/k8s/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=k8s-amd64
            type=gha,scope=k8s-arm64
          cache-to: type=gha,mode=max,scope=k8s-release
