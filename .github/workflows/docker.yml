name: Docker

on:
  pull_request:
    paths:
      - container/k8s/**
      - scripts/bootstrap.sh
      - .github/workflows/container.yml
  workflow_call:
    inputs:
      publish:
        description: Publish the container image to GHCR
        required: true
        type: boolean
      version:
        description: Container image version and Git tag to publish
        required: true
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Docker Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker Build
        uses: sentenz/actions/docker@d3b0a0d59ac008f6918c5d8304acab2c9d1abbf2 # 1.4.3
        with:
          version: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Docker Action - Publish
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Run Docker Publish
        uses: sentenz/actions/docker@d3b0a0d59ac008f6918c5d8304acab2c9d1abbf2 # 1.4.3
        with:
          version: ${{ inputs.version }}
          context: .
          file: container/k8s/Dockerfile
          image-name: k8s
          platforms: linux/amd64,linux/arm64
          push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
