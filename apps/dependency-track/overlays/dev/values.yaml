---
# NOTE Development-only credentials. The chart renders these into the
# `dependency-track-database` Secret. Persistent environments reference an
# externally managed Secret via `database.existingSecret`.
database:
  jdbcUrl: "jdbc:postgresql://postgresql.postgresql.svc.cluster.local:5432/dtrack"
  username: "dtrack"
  password: "dtrack"

# XXX Development-only fixture KEK. Persistent environments use an externally managed Secret.
secretManagement:
  database:
    kek:
      value: "h1lrkPlxxIe9K92pUQkV4O+gn4NMP1E9pN4p94zC5IE="

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: "dependency-track.localhost"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  tls:
    - secretName: dependency-track-tls
      hosts:
        - dependency-track.localhost
