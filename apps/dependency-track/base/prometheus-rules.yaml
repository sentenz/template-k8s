---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dependency-track
  namespace: dependency-track
  labels:
    app.kubernetes.io/name: dependency-track
    app.kubernetes.io/part-of: dependency-track
spec:
  groups:
    - name: dependency-track.availability
      rules:
        - alert: DependencyTrackMetricsTargetDown
          expr: up{namespace="dependency-track",service="dependency-track-api-server-metrics"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Dependency-Track API server metrics target is down
            description: Prometheus has been unable to scrape a Dependency-Track API server management endpoint for at least five minutes.
        - alert: DependencyTrackJvmHeapHigh
          expr: |
            (
              sum by (pod) (jvm_memory_used_bytes{namespace="dependency-track",area="heap"})
              /
              sum by (pod) (jvm_memory_max_bytes{namespace="dependency-track",area="heap"})
            ) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Dependency-Track JVM heap utilization is high
            description: Dependency-Track JVM heap utilization has remained above 90% for at least ten minutes.
