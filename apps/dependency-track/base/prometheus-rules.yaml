---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dependency-track
  namespace: observability
  labels:
    app.kubernetes.io/name: dependency-track
    app.kubernetes.io/part-of: dependency-track
spec:
  groups:
    - name: dependency-track.availability
      rules:
        - alert: DependencyTrackMetricsTargetDown
          expr: up{namespace="dependency-track",service="dependency-track-api-server-metrics"} == 0
          for: 5m
          labels:
            severity: critical
            strategy: availability
          annotations:
            summary: Dependency-Track API server metrics target is down
            description: Prometheus has been unable to scrape a Dependency-Track API server management endpoint for at least five minutes.
        - alert: DependencyTrackJvmHeapHigh
          expr: |
            (
              sum by (pod) (jvm_memory_used_bytes{namespace="dependency-track",area="heap"})
              /
              sum by (pod) (jvm_memory_max_bytes{namespace="dependency-track",area="heap"})
            ) > 0.90
          for: 10m
          labels:
            severity: warning
            strategy: use
          annotations:
            summary: Dependency-Track JVM heap utilization is high
            description: Dependency-Track JVM heap utilization has remained above 90% for at least ten minutes.

    - name: dependency-track.red
      rules:
        - record: dependency_track:red_request_rate:rate5m
          expr: |
            sum(
              rate(
                traefik_service_requests_total{
                  service=~"dependency-track-.*@kubernetes"
                }[5m]
              )
            )
          labels:
            strategy: red
        - record: dependency_track:red_error_rate:ratio5m
          expr: |
            sum(
              rate(
                traefik_service_requests_total{
                  service=~"dependency-track-.*@kubernetes",
                  code=~"5.."
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                rate(
                  traefik_service_requests_total{
                    service=~"dependency-track-.*@kubernetes"
                  }[5m]
                )
              ),
              0.001
            )
          labels:
            strategy: red
        - record: dependency_track:red_duration_seconds:p95_5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  traefik_service_request_duration_seconds_bucket{
                    service=~"dependency-track-.*@kubernetes"
                  }[5m]
                )
              )
            )
          labels:
            strategy: red
        - alert: DependencyTrackHighErrorRate
          expr: |
            dependency_track:red_error_rate:ratio5m > 0.05
            and
            dependency_track:red_request_rate:rate5m > 0.1
          for: 10m
          labels:
            severity: warning
            strategy: red
          annotations:
            summary: Dependency-Track RED error rate is high
            description: More than 5% of Dependency-Track ingress requests have returned 5xx responses for at least ten minutes.
        - alert: DependencyTrackHighRequestLatency
          expr: |
            dependency_track:red_duration_seconds:p95_5m > 2
            and
            dependency_track:red_request_rate:rate5m > 0.1
          for: 10m
          labels:
            severity: warning
            strategy: red
          annotations:
            summary: Dependency-Track RED request latency is high
            description: Dependency-Track ingress p95 request duration has exceeded two seconds for at least ten minutes.

    - name: dependency-track.use
      rules:
        - record: dependency_track:use_cpu_utilization:ratio5m
          expr: |
            sum(
              rate(
                container_cpu_usage_seconds_total{
                  namespace="dependency-track",
                  container!="",
                  container!="POD"
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                kube_pod_container_resource_requests{
                  namespace="dependency-track",
                  resource="cpu",
                  unit="core"
                }
              ),
              0.001
            )
          labels:
            strategy: use
        - record: dependency_track:use_memory_utilization:ratio
          expr: |
            sum(
              container_memory_working_set_bytes{
                namespace="dependency-track",
                container!="",
                container!="POD"
              }
            )
            /
            clamp_min(
              sum(
                kube_pod_container_resource_limits{
                  namespace="dependency-track",
                  resource="memory",
                  unit="byte"
                }
              ),
              1
            )
          labels:
            strategy: use
        - record: dependency_track:use_cpu_saturation:ratio5m
          expr: |
            sum(
              rate(
                container_cpu_cfs_throttled_periods_total{
                  namespace="dependency-track",
                  container!="",
                  container!="POD"
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                rate(
                  container_cpu_cfs_periods_total{
                    namespace="dependency-track",
                    container!="",
                    container!="POD"
                  }[5m]
                )
              ),
              0.001
            )
          labels:
            strategy: use
        - record: dependency_track:use_container_restarts:increase15m
          expr: |
            sum(
              increase(
                kube_pod_container_status_restarts_total{
                  namespace="dependency-track"
                }[15m]
              )
            )
          labels:
            strategy: use
        - alert: DependencyTrackCpuUtilizationHigh
          expr: dependency_track:use_cpu_utilization:ratio5m > 0.90
          for: 15m
          labels:
            severity: warning
            strategy: use
          annotations:
            summary: Dependency-Track CPU utilization is high
            description: Dependency-Track is using more than 90% of its requested CPU for at least fifteen minutes.
        - alert: DependencyTrackMemoryUtilizationHigh
          expr: dependency_track:use_memory_utilization:ratio > 0.90
          for: 10m
          labels:
            severity: warning
            strategy: use
          annotations:
            summary: Dependency-Track memory utilization is high
            description: Dependency-Track working-set memory has exceeded 90% of configured container memory limits for at least ten minutes.
        - alert: DependencyTrackCpuSaturationHigh
          expr: dependency_track:use_cpu_saturation:ratio5m > 0.25
          for: 10m
          labels:
            severity: warning
            strategy: use
          annotations:
            summary: Dependency-Track CPU saturation is high
            description: More than 25% of Dependency-Track container CPU scheduling periods have been throttled for at least ten minutes.
        - alert: DependencyTrackContainerRestarting
          expr: dependency_track:use_container_restarts:increase15m > 0
          for: 5m
          labels:
            severity: warning
            strategy: use
          annotations:
            summary: Dependency-Track containers are restarting
            description: One or more Dependency-Track containers restarted during the last fifteen minutes.
