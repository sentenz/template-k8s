---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmGlobals:
  chartHome: ../../../../../vendor/helm

helmCharts:
  - name: kube-prometheus-stack
    version: 88.3.0
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: observability
    namespace: observability
    includeCRDs: true
    valuesFile: ../../values/kube-prometheus-stack.yaml
    valuesInline:
      grafana:
        persistence:
          enabled: true
          size: 5Gi
      prometheus:
        prometheusSpec:
          retention: 7d
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 20Gi
  - name: loki
    version: 18.8.0
    repo: https://grafana-community.github.io/helm-charts
    releaseName: loki
    namespace: observability
    valuesFile: ../../values/loki.yaml
    valuesInline:
      singleBinary:
        persistence:
          enabled: true
          size: 20Gi
  - name: tempo
    version: 2.2.3
    repo: https://grafana-community.github.io/helm-charts
    releaseName: tempo
    namespace: observability
    valuesFile: ../../values/tempo.yaml
    valuesInline:
      tempo:
        retention: 168h
      persistence:
        enabled: true
        size: 20Gi
  - name: opentelemetry-collector
    version: 0.169.0
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    releaseName: otel-collector
    namespace: observability
    valuesFile: ../../values/opentelemetry-collector.yaml
