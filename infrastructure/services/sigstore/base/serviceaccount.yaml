---
# ServiceAccount used as the OIDC identity for `cosign sign` against the
# self-hosted Fulcio. Fulcio's default config trusts Kubernetes ServiceAccount
# tokens (issuer https://kubernetes.default.svc), so minting a token for this
# account (`kubectl create token cosign-dev -n fulcio-system`) yields a valid
# signing identity without an external identity provider. See the Makefile
# targets `sast-cosign-sign` / `sast-cosign-verify-image`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosign-dev
  namespace: fulcio-system
