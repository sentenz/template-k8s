apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry, namespace: sigstore-registry}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: sigstore-registry}
spec:
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: kind}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
          readinessProbe: {tcpSocket: {port: 5000}}
          livenessProbe: {tcpSocket: {port: 5000}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 500m, memory: 256Mi}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: registry}}
        - {name: auth, secret: {secretName: registry-auth}}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: sigstore-registry}
spec:
  selector: {app: registry}
  ports: [{port: 80, targetPort: 5000}]
