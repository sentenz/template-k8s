apiVersion: v1
kind: ConfigMap
metadata: {name: tuf-web, namespace: tuf-system}
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location /targets/ {
        alias /var/run/tuf-targets/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tuf, namespace: tuf-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: tuf}}
  template:
    metadata: {labels: {app: tuf}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: static
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          readinessProbe: {httpGet: {path: /timestamp.json, port: 8080}}
          livenessProbe: {tcpSocket: {port: 8080}}
          volumeMounts:
            - {name: metadata, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: targets, mountPath: /var/run/tuf-targets, readOnly: true}
            - {name: web, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
        - name: metadata
          configMap: {name: tuf-metadata}
        - name: targets
          configMap: {name: tuf-targets}
        - name: web
          configMap: {name: tuf-web}
---
apiVersion: v1
kind: Service
metadata: {name: tuf, namespace: tuf-system}
spec:
  selector: {app: tuf}
  ports: [{name: http, port: 80, targetPort: 8080}]
