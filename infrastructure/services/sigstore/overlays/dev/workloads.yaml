apiVersion: apps/v1
kind: Deployment
metadata: {name: tuf, namespace: tuf-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: tuf}}
  template:
    metadata: {labels: {app: tuf}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: static
          image: nginxinc/nginx-unprivileged:1.28.0-alpine
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          readinessProbe: {httpGet: {path: /timestamp.json, port: 8080}}
          livenessProbe: {tcpSocket: {port: 8080}}
          volumeMounts:
            - {name: metadata, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
        - name: metadata
          projected:
            sources:
              - configMap: {name: tuf-metadata}
              - configMap:
                  name: tuf-targets
                  items:
                    - {key: trusted_root.json, path: targets/trusted_root.json}
                    - {key: signing_config.v0.2.json, path: targets/signing_config.v0.2.json}
---
apiVersion: v1
kind: Service
metadata: {name: tuf, namespace: tuf-system}
spec:
  selector: {app: tuf}
  ports: [{port: 80, targetPort: 8080}]
