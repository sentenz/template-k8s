apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - network-policy.yaml
  - registry.yaml
  - workloads.yaml
  - ingress.yaml

helmCharts:
  - name: scaffold
    version: 0.6.125
    repo: https://sigstore.github.io/helm-charts
    releaseName: kind-sigstore
    namespace: sigstore-system
    valuesFile: scaffold.yaml
  - name: policy-controller
    version: 0.10.8
    repo: https://sigstore.github.io/helm-charts
    releaseName: kind-policy
    namespace: sigstore-policy
    valuesFile: controller.yaml
