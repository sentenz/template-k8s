---
# Rekor — stage. Expects the `rekor-tls` Secret in `rekor-system` and the
# `sigstore-mysql` Secret in `rekor-system` and `trillian-system` to be supplied
# externally.
namespace:
  create: false
  name: rekor-system
forceNamespace: rekor-system

server:
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    hosts:
      - path: /
        host: rekor.example.com
    tls:
      - secretName: rekor-tls
        hosts:
          - rekor.example.com
  searchIndex:
    storageProvider: mysql
    mysql:
      envCredentials:
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: sigstore-mysql
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sigstore-mysql
              key: mysql-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: sigstore-mysql
              key: mysql-database
        - name: MYSQL_HOSTNAME
          value: mysql-sigstore.mysql-sigstore.svc.cluster.local
        - name: MYSQL_PORT
          value: "3306"

mysql:
  enabled: false
  hostname: mysql-sigstore.mysql-sigstore.svc.cluster.local
  port: 3306
  auth:
    existingSecret: sigstore-mysql

trillian:
  enabled: true
  namespace:
    create: false
    name: trillian-system
  forceNamespace: trillian-system
  mysql:
    enabled: false
    hostname: mysql-sigstore.mysql-sigstore.svc.cluster.local
    port: 3306
    auth:
      existingSecret: sigstore-mysql
  storageSystem:
    driver: mysql
    envCredentials:
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
            name: sigstore-mysql
            key: mysql-user
      - name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sigstore-mysql
            key: mysql-password
      - name: MYSQL_DATABASE
        valueFrom:
          secretKeyRef:
            name: sigstore-mysql
            key: mysql-database
      - name: MYSQL_HOSTNAME
        value: mysql-sigstore.mysql-sigstore.svc.cluster.local
      - name: MYSQL_PORT
        value: "3306"
  quotaSystem:
    driver: mysql
