---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/scoped-secrets

helmGlobals:
  chartHome: ../../../../../vendor/helm

helmCharts:
  - name: traefik
    version: 41.7.1
    repo: https://traefik.github.io/charts
    releaseName: traefik
    namespace: traefik
    valuesFile: values.yaml
    additionalValuesFiles:
      - ../../components/scoped-secrets/provider-values.yaml

patches:
  - path: patch-service-nodeport.yaml
